version: '3.9'
services:
  translator_frontend:
    build: .
    container_name: translator_frontend
    ports:
      - "${VITE_PORT:-5173}:80"
    environment:
      - NODE_ENV=production
    env_file: .env
    depends_on:
      - translator_backend

  translator_backend:
    image: python:3.11-slim
    container_name: translator_backend
    working_dir: /app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
