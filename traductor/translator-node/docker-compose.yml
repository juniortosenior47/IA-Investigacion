version: "3.9"

services:
  api:
    build: .
    container_name: translator-node-api
    ports:
      - "3000:3000"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  redis:
    image: redis:7
    container_name: translator-redis
    ports:
      - "6379:6379"
