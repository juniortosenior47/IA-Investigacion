version: '3.9'

services:
  translator_frontend:
    container_name: translator_frontend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${VITE_PORT:-5173}:80"
    env_file:
      - .env
    environment:
      - VITE_BACKEND_URL=${VITE_BACKEND_URL}
      - VITE_PREFIX=${VITE_PREFIX}
    restart: unless-stopped
