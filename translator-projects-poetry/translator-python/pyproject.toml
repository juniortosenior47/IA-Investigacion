[tool.poetry]
name = "translator-python-poetry"
version = "1.0.0"
description = "FastAPI translator with Redis cache (Poetry-managed)"
authors = ["example <dev@example.com>"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
redis = "^5.0.8"
python-dotenv = "^1.0.1"
requests = "^2.32.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
