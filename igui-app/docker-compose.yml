version: "3.9"
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.rest
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
    working_dir: /usr/src/app

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "5173:5173"
    working_dir: /app
    depends_on:
      - api
